version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: markly-postgres
    environment:
      POSTGRES_DB: markly
      POSTGRES_USER: markly_user
      POSTGRES_PASSWORD: markly_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

volumes:
  postgres_data:
